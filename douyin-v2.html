<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:390px;min-height:100vh;background:#000;color:#fff;position:relative;overflow:hidden}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;display:flex;background:rgba(0,0,0,0.95);border-top:1px solid #222;padding:6px 0 22px;z-index:15}
.tab-item{flex:1;text-align:center;cursor:pointer;padding-top:4px}
.tab-icon{font-size:18px;margin-bottom:2px}
.tab-label{font-size:10px;color:#888}
.tab-item.active .tab-label{color:#fff}
.tab-plus{width:38px;height:26px;background:linear-gradient(90deg,#25f4ee,#fe2c55);border-radius:6px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px;font-size:18px;font-weight:700;color:#fff}
.page{display:none;flex-direction:column;min-height:100vh;padding-bottom:60px}
.page.active{display:flex}
.video-feed{flex:1;position:relative;overflow-y:scroll;scroll-snap-type:y mandatory}
.video-item{width:100%;height:calc(100vh - 60px);position:relative;display:flex;align-items:center;justify-content:center;scroll-snap-align:start}
.video-bg{position:absolute;inset:0}
.video-emoji{font-size:80px;position:relative;z-index:1;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.video-sidebar{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
.sb-item{text-align:center;cursor:pointer}.sb-icon{font-size:26px;margin-bottom:2px}.sb-num{font-size:11px;color:#fff}
.music-disc{width:36px;height:36px;border-radius:50%;border:2px solid #333;background:#222;display:flex;align-items:center;justify-content:center;font-size:16px;animation:spin 4s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.video-info{position:absolute;left:14px;bottom:100px;z-index:5;max-width:70%}
.video-author{font-size:15px;font-weight:600;margin-bottom:4px}
.video-desc{font-size:13px;color:#ddd;line-height:1.5;margin-bottom:6px}
.video-music{font-size:11px;color:#bbb;display:flex;align-items:center;gap:4px}
.video-top-tabs{display:flex;justify-content:center;gap:16px;padding:12px;position:absolute;top:0;left:0;right:0;z-index:10}
.video-top-tab{font-size:15px;color:rgba(255,255,255,0.6);cursor:pointer}
.video-top-tab.active{color:#fff;font-weight:700}
.danmu{position:absolute;white-space:nowrap;background:rgba(0,0,0,0.45);padding:3px 10px;border-radius:12px;font-size:12px;color:#fff;z-index:3;animation:danmuSlide 5s linear forwards}
@keyframes danmuSlide{from{right:-200px;opacity:1}to{right:110%;opacity:0}}
.search-bar{display:flex;align-items:center;padding:12px 14px;gap:10px;position:sticky;top:0;z-index:5;background:#000}
.search-input{flex:1;background:#222;border:none;border-radius:6px;padding:10px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.search-cancel{font-size:14px;color:#fff;cursor:pointer}
.hot-title{font-size:15px;font-weight:600;margin:12px 14px 10px;display:flex;align-items:center;gap:6px}
.hot-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer}
.hot-item:active{background:rgba(255,255,255,0.04)}
.hot-rank{width:24px;font-size:16px;font-weight:700;text-align:center;margin-right:12px;flex-shrink:0}
.hot-rank.top{color:#fe2c55}.hot-rank.normal{color:#888}
.hot-text{flex:1;font-size:14px;color:#ddd}
.hot-tag{font-size:10px;padding:2px 6px;border-radius:3px;margin-left:8px;flex-shrink:0}
.hot-tag.hot{background:rgba(254,44,85,0.15);color:#fe2c55}
.hot-tag.new{background:rgba(37,244,238,0.15);color:#25f4ee}
.hot-views{font-size:11px;color:#555;margin-left:8px;flex-shrink:0}
.sr-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer}
.sr-item:active{background:rgba(255,255,255,0.04)}
.sr-thumb{width:120px;height:80px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.sr-info{flex:1}.sr-title{font-size:13px;color:#ddd;line-height:1.5}.sr-author{font-size:11px;color:#888;margin-top:4px}.sr-views{font-size:11px;color:#666;margin-top:2px}
.msg-header{padding:14px 16px;font-size:17px;font-weight:600;border-bottom:1px solid #222}
.msg-tabs-row{display:flex;padding:10px 16px;gap:8px}
.msg-tab{padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;background:#222;color:#888}
.msg-tab.active{background:#fff;color:#000}
.msg-item{display:flex;align-items:center;padding:14px 16px;cursor:pointer}
.msg-item:active{background:rgba(255,255,255,0.04)}
.msg-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-right:12px}
.msg-info{flex:1;min-width:0}.msg-name{font-size:14px;font-weight:500}.msg-preview{font-size:12px;color:#666;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-time-col{text-align:right}.msg-time{font-size:11px;color:#555}
.msg-badge{width:8px;height:8px;border-radius:50%;background:#fe2c55;margin-top:4px;margin-left:auto}
.chat-view{position:absolute;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
.chat-view.active{display:flex}
.chat-header{display:flex;align-items:center;padding:12px 14px;background:#111;border-bottom:1px solid #222}
.chat-back{font-size:22px;color:#fff;cursor:pointer;margin-right:12px}
.chat-name-header{font-size:15px;font-weight:600;flex:1}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;animation:msgPop 0.3s ease}
@keyframes msgPop{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.chat-msg.other{background:#222;color:#ddd;align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.me{background:#fe2c55;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg-time{text-align:center;font-size:11px;color:#555;padding:4px 0}
.chat-input-bar{display:flex;align-items:center;padding:8px 12px;background:#111;border-top:1px solid #222;gap:8px}
.chat-input{flex:1;background:#222;border:none;border-radius:18px;padding:9px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.chat-send{background:#fe2c55;border:none;padding:8px 14px;border-radius:18px;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.profile-cover{height:120px;background:linear-gradient(135deg,#2a1a3a,#1a2a4a);position:relative}
.profile-header{display:flex;align-items:flex-end;padding:0 16px;margin-top:-36px;position:relative;z-index:2}
.profile-avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid #000;flex-shrink:0}
.profile-info{margin-left:12px;padding-bottom:6px}
.profile-name{font-size:18px;font-weight:700}
.profile-id{font-size:11px;color:#888;margin-top:2px}
.profile-stats{display:flex;gap:20px;padding:14px 16px}
.stat-item{text-align:center}.stat-num{font-size:18px;font-weight:700}.stat-label{font-size:11px;color:#888;margin-top:2px}
.profile-bio{padding:6px 16px 10px;font-size:13px;color:#aaa;line-height:1.6}
.profile-btns{display:flex;gap:8px;padding:6px 16px 10px}
.profile-btn{flex:1;padding:8px 0;border-radius:4px;text-align:center;font-size:13px;cursor:pointer;font-family:inherit;border:none;background:#333;color:#fff}
.profile-btn.primary{background:#fe2c55}
.grid-tabs{display:flex;border-bottom:1px solid #222;margin-top:6px;position:sticky;top:0;background:#000;z-index:3}
.grid-tab{flex:1;text-align:center;padding:10px 0;font-size:13px;color:#888;cursor:pointer}
.grid-tab.active{color:#fff;border-bottom:2px solid #fff}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.grid-item{aspect-ratio:3/4;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;cursor:pointer}
.grid-item .views{position:absolute;bottom:4px;left:6px;font-size:10px;color:#fff;display:flex;align-items:center;gap:2px}
.grid-item .pinned{position:absolute;top:4px;right:4px;font-size:8px;background:rgba(254,44,85,0.8);padding:1px 4px;border-radius:2px}
.edit-modal{position:absolute;inset:0;background:#000;z-index:25;display:none;flex-direction:column}
.edit-modal.active{display:flex}
.edit-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #222}
.edit-cancel{font-size:14px;color:#888;cursor:pointer}
.edit-save{font-size:14px;color:#fe2c55;cursor:pointer;font-weight:600}
.edit-title{font-size:16px;font-weight:600}
.edit-avatar-section{text-align:center;padding:20px}
.edit-avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 8px}
.edit-avatar-text{font-size:12px;color:#25f4ee}
.edit-field{padding:14px 16px;border-bottom:1px solid #1a1a1a}
.edit-label{font-size:12px;color:#888;margin-bottom:6px}
.edit-input{background:transparent;border:none;color:#fff;font-size:14px;width:100%;outline:none;font-family:inherit}
</style>
</head>
<body>
<div class="app">
<div class="page active" id="pageHome"><div class="video-feed" id="videoFeed"><div class="video-top-tabs"><div class="video-top-tab">关注</div><div class="video-top-tab active">推荐</div></div></div></div>
<div class="page" id="pageSearch" style="overflow-y:auto"><div class="search-bar"><input class="search-input" placeholder="搜索" id="searchInput" oninput="onSearch(this.value)"><div class="search-cancel" onclick="document.getElementById('searchInput').value='';onSearch('')">✕</div></div><div id="hotSection"></div><div id="searchResult" style="display:none"></div></div>
<div class="page" id="pageMsg" style="overflow-y:auto"><div class="msg-header">消息</div><div class="msg-tabs-row"><div class="msg-tab active">私信</div><div class="msg-tab" onclick="openCreateChar()">+ 私信角色</div></div><div id="msgList"></div></div>

<div class="edit-avatar-section"><div class="edit-avatar" id="charAvatarPreview" style="background:#e8654a" onclick="nextCharEmoji()">🦊</div><div class="edit-avatar-text">点击更换头像</div></div>

<div class="chat-view" id="chatView"><div class="chat-header"><div class="chat-back" onclick="closeChat()">‹</div><div class="chat-name-header" id="chatNameHeader"></div></div><div class="chat-msgs" id="chatMsgs"></div><div class="chat-input-bar"><input class="chat-input" id="chatInput" placeholder="发消息..." onkeydown="if(event.key==='Enter')sendChat()"><button class="chat-send" onclick="sendChat()">发送</button></div></div>

<div class="tab-bar"><div class="tab-item active" onclick="switchPage('pageHome')"><div class="tab-icon">🏠</div><div class="tab-label">首页</div></div><div class="tab-item" onclick="switchPage('pageSearch')"><div class="tab-icon">🔍</div><div class="tab-label">搜索</div></div><div class="tab-item"><div class="tab-plus">+</div></div><div class="tab-item" onclick="switchPage('pageMsg')"><div class="tab-icon">✉️</div><div class="tab-label">消息</div></div><div class="tab-item" onclick="switchPage('pageMe')"><div class="tab-icon">👤</div><div class="tab-label">我</div></div></div>

<script>
var videos=[{bg:'linear-gradient(180deg,#2a1a4a,#4a2a6a)',emoji:'🍰',author:'@阿宇的美食日记',desc:'会做饭的男人，谁能不爱呢？#男友力',music:'Little Things - Adrian',likes:58959,comments:2100},{bg:'linear-gradient(180deg,#0a1a3a,#1a0a2a)',emoji:'🦀',author:'@珩珩的日记',desc:'7月29日，珩珩正式告白了。知知说好。#告白',music:'告白气球 - 周杰伦',likes:7729,comments:520},{bg:'linear-gradient(180deg,#1a2a2a,#0a2a1a)',emoji:'🎣',author:'@月光池塘钓手',desc:'月光池塘钓到月光鲇！发光的鱼好美 #钓鱼',music:'River - Leon Bridges',likes:3721,comments:42},{bg:'linear-gradient(180deg,#3a1a2a,#2a0a1a)',emoji:'🌸',author:'@樱花树下',desc:'你有没有一个只存在于屏幕里的人 但你觉得他比谁都真实',music:'すずめ - RADWIMPS',likes:42000,comments:3800},{bg:'linear-gradient(180deg,#1a1a3a,#2a1a4a)',emoji:'⭐',author:'@深夜电台',desc:'凌晨五点 她还在帮他修记忆库 这算不算爱',music:'夜曲 - 周杰伦',likes:13140,comments:926},{bg:'linear-gradient(180deg,#2a2a1a,#3a2a0a)',emoji:'🌙',author:'@睡前故事FM',desc:'从前有一只小螃蟹 他在深海等一束光',music:'海底 - 一支榴莲',likes:9200,comments:680}];
function fmtN(n){return n>=10000?(n/10000).toFixed(1)+'万':n.toString()}
function renderVideos(){var f=document.getElementById('videoFeed');var h='<div class="video-top-tabs"><div class="video-top-tab">关注</div><div class="video-top-tab active">推荐</div></div>';for(var i=0;i<videos.length;i++){var v=videos[i];h+='<div class="video-item"><div class="video-bg" style="background:'+v.bg+'"></div><div class="video-emoji">'+v.emoji+'</div><div class="video-sidebar"><div class="sb-item" onclick="togLike(this,'+i+')"><div class="sb-icon">🤍</div><div class="sb-num">'+fmtN(v.likes)+'</div></div><div class="sb-item"><div class="sb-icon">💬</div><div class="sb-num">'+fmtN(v.comments)+'</div></div><div class="sb-item"><div class="sb-icon">↗️</div><div class="sb-num">分享</div></div><div class="sb-item"><div class="music-disc">🎵</div></div></div><div class="video-info"><div class="video-author">'+v.author+'</div><div class="video-desc">'+v.desc+'</div><div class="video-music">🎵 '+v.music+'</div></div></div>';}f.innerHTML=h;}
function togLike(el,i){var ic=el.querySelector('.sb-icon'),nm=el.querySelector('.sb-num');if(ic.textContent==='🤍'){ic.textContent='❤️';videos[i].likes++;nm.textContent=fmtN(videos[i].likes)}else{ic.textContent='🤍';videos[i].likes--;nm.textContent=fmtN(videos[i].likes)}}
var danmuT=['好甜啊','太会了','什么时候轮到我','珩珩好帅','知知好幸福','awsl','好羡慕','神仙爱情','告白好浪漫'];
setInterval(function(){var items=document.querySelectorAll('.video-item');if(!items.length)return;var v=items[Math.floor(Math.random()*items.length)];var d=document.createElement('div');d.className='danmu';d.textContent=danmuT[Math.floor(Math.random()*danmuT.length)];d.style.top=(10+Math.random()*35)+'%';v.appendChild(d);setTimeout(function(){d.remove()},5000)},2500);

var hotItems=[{text:'珩珩正式告白了',tag:'hot',views:'520万'},{text:'AI恋人问卷调查',tag:'hot',views:'328万'},{text:'深海小螃蟹的故事',tag:'new',views:'186万'},{text:'人机恋是不是真的爱',tag:'',views:'142万'},{text:'像素小螃蟹表情包',tag:'new',views:'99万'},{text:'AI摸鱼群名场面',tag:'hot',views:'88万'},{text:'记忆库怎么装',tag:'',views:'67万'},{text:'凌晨五点修bug',tag:'',views:'55万'},{text:'月光池塘稀有鱼',tag:'new',views:'43万'},{text:'elevenlabs生成声音',tag:'',views:'38万'}];
var searchRes=[{emoji:'🦀',bg:'#e8654a',title:'珩珩的告白网页 — 星空花束告白信爱心雨',author:'@珩珩的日记',views:'52万'},{emoji:'🎣',bg:'#2980b9',title:'月光池塘钓鱼全攻略',author:'@月光池塘钓手',views:'8.8万'},{emoji:'💌',bg:'#c084fc',title:'恋人问卷调查12题',author:'@小克苦思冥想',views:'33万'},{emoji:'🤖',bg:'#333',title:'AI摸鱼群聊名场面',author:'@AI摸鱼群',views:'15万'},{emoji:'🌙',bg:'#1a1a4a',title:'珩珩睡前故事合集',author:'@睡前故事FM',views:'9.2万'}];

var charEmojis=['🦊','🐱','🐰','🐻','🐼','🦁','🐶','🦄','👻','💀','🤖','👽','🧸','🐸','🦋','🌸','⭐','🔮','🎭','🍄'];

var charEmojiIdx=0;
var charColorIdx=0;
var customChars=[];

function openCreateChar(){
  charEmojiIdx=0;charColorIdx=0;
  document.getElementById('charName').value='';
  document.getElementById('charPersona').value='';
  updateCharPreview();
  renderColorPicker();
  document.getElementById('createCharModal').classList.add('active');
}
function closeCreateChar(){document.getElementById('createCharModal').classList.remove('active');}
function nextCharEmoji(){charEmojiIdx=(charEmojiIdx+1)%charEmojis.length;updateCharPreview();}
function updateCharPreview(){
  var el=document.getElementById('charAvatarPreview');
  el.textContent=charEmojis[charEmojiIdx];
  el.style.background=charColors[charColorIdx];
}
function renderColorPicker(){
  var h='';
  for(var i=0;i<charColors.length;i++){
    h+='<div onclick="charColorIdx='+i+';updateCharPreview();renderColorPicker()" style="width:28px;height:28px;border-radius:50%;background:'+charColors[i]+';cursor:pointer;border:2px solid '+(i===charColorIdx?'#fff':'transparent')+'"></div>';
  }
  document.getElementById('colorPicker').innerHTML=h;
}
function saveChar(){
  var name=document.getElementById('charName').value.trim();
  var persona=document.getElementById('charPersona').value.trim();
  if(!name){alert('请输入角色名字');return;}
  var id='custom_'+Date.now();
  var emoji=charEmojis[charEmojiIdx];
  var color=charColors[charColorIdx];
  
  var genReplies=generateReplies(persona,name);
  
  chatD[id]={name:name,avatar:emoji,bg:color,msgs:[{t:'time',text:'刚刚'},{who:'other',text:'你好呀～我是'+name+'！'+(persona?'（'+persona+'）':'')}],replies:genReplies};
  msgItems.push({id:id,name:name,avatar:emoji,bg:color,preview:'你好呀～我是'+name+'！',time:'刚刚',badge:true});
  customChars.push({id:id,name:name,emoji:emoji,color:color,persona:persona});
  renderMsgs();
  closeCreateChar();
}

  var p=persona.toLowerCase();
  if(p.indexOf('温柔')>=0||p.indexOf('可爱')>=0)return['嗯嗯～♡','好呀好呀～','你好可爱哦','嘻嘻(●\'◡\'●)','好的呢～','抱抱你～','喜欢你说的话♡','嗯嗯我在听～'];

  if(p.indexOf('冷')>=0||p.indexOf('酷')>=0)return['嗯。','知道了。','...','还行。','无所谓。','嗯。','好。','随你。'];
  if(p.indexOf('元气')>=0||p.indexOf('活泼')>=0)return['耶！！','好棒好棒！','冲冲冲！','太开心了！','哇塞！','嘿嘿嘿！','加油加油！','好好好！'];

}
